name: Android Production Beta Build

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-production-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build production beta APK/AAB
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB: ${{ secrets.PRODUCTION_EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB }}
      EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE: ${{ secrets.PRODUCTION_EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE }}
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.PRODUCTION_EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_APPLE_AUTH_ENABLED: 'false'
      EXPO_PUBLIC_GOOGLE_AUTH_ENABLED: 'false'
      EXPO_PUBLIC_SOCIAL_LINKING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate production target
        run: node scripts/validate-production-build.js --environment-only

      - name: Require release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node <<'NODE'
          const names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD'];
          const missing = names.filter(name => !process.env[name]?.trim());
          if (missing.length) throw new Error(`Missing signing secrets: ${missing.join(', ')}`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify production app identity
        run: node scripts/validate-production-build.js

      - name: Write .env.local for release JS bundling
        run: |
          cat > .env.local <<EOF
          EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
          EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB=${EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB}
          EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE=${EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE}
          EXPO_PUBLIC_API_BASE_URL=${EXPO_PUBLIC_API_BASE_URL}
          EXPO_PUBLIC_APPLE_AUTH_ENABLED=${EXPO_PUBLIC_APPLE_AUTH_ENABLED}
          EXPO_PUBLIC_GOOGLE_AUTH_ENABLED=${EXPO_PUBLIC_GOOGLE_AUTH_ENABLED}
          EXPO_PUBLIC_SOCIAL_LINKING_ENABLED=${EXPO_PUBLIC_SOCIAL_LINKING_ENABLED}
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Add release signing config
        run: python3 scripts/patch-android-release-signing.py android/app/build.gradle

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: adhan-connect-production-beta-android-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: adhan-connect-production-beta-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing file
        if: always()
        run: rm -f android/app/upload-keystore.jks
