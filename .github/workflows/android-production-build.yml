name: Android Production Beta Build

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-production-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build production beta APK/AAB
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB: ${{ secrets.PRODUCTION_EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB }}
      EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE: ${{ secrets.PRODUCTION_EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE }}
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.PRODUCTION_EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_APPLE_AUTH_ENABLED: 'false'
      EXPO_PUBLIC_GOOGLE_AUTH_ENABLED: 'false'
      EXPO_PUBLIC_SOCIAL_LINKING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_PUBLIC_SUPABASE_URL"
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          test -n "$EXPO_PUBLIC_API_BASE_URL"
          node <<'NODE'
          const expectedSupabaseHost = 'yecbsezhwvpdkuzmmziv.supabase.co';
          const supabase = new URL(process.env.EXPO_PUBLIC_SUPABASE_URL);
          const api = new URL(process.env.EXPO_PUBLIC_API_BASE_URL);
          if (supabase.protocol !== 'https:' || supabase.hostname !== expectedSupabaseHost) {
            throw new Error('Production build has the wrong Supabase target.');
          }
          if (api.protocol !== 'https:') {
            throw new Error('Production API base URL must use HTTPS.');
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Verify production app identity
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const config = JSON.parse(execFileSync('npx', ['expo', 'config', '--json'], { encoding: 'utf8' }));
          if (config.android?.package !== 'com.maksumsdigitalagency.adhanconnect') {
            throw new Error(`Unexpected Android package: ${config.android?.package ?? 'missing'}`);
          }
          if (config.extra?.appVariant !== 'production') {
            throw new Error(`Unexpected app variant: ${config.extra?.appVariant ?? 'missing'}`);
          }
          NODE

      - name: Write .env.local for release JS bundling
        run: |
          cat > .env.local <<EOF
          EXPO_PUBLIC_SUPABASE_URL=${EXPO_PUBLIC_SUPABASE_URL}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${EXPO_PUBLIC_SUPABASE_ANON_KEY}
          EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB=${EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB}
          EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE=${EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE}
          EXPO_PUBLIC_API_BASE_URL=${EXPO_PUBLIC_API_BASE_URL}
          EXPO_PUBLIC_APPLE_AUTH_ENABLED=${EXPO_PUBLIC_APPLE_AUTH_ENABLED}
          EXPO_PUBLIC_GOOGLE_AUTH_ENABLED=${EXPO_PUBLIC_GOOGLE_AUTH_ENABLED}
          EXPO_PUBLIC_SOCIAL_LINKING_ENABLED=${EXPO_PUBLIC_SOCIAL_LINKING_ENABLED}
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK for production-backend smoke testing
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload smoke-test APK
        uses: actions/upload-artifact@v4
        with:
          name: adhan-connect-production-beta-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Check release signing secrets are configured
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode upload keystore
        if: steps.signing.outputs.configured == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Add release signing config
        if: steps.signing.outputs.configured == 'true'
        run: python3 scripts/patch-android-release-signing.py android/app/build.gradle

      - name: Build signed release AAB
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload signed AAB
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: adhan-connect-production-beta-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
