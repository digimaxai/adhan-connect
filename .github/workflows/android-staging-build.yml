name: Android Staging Build

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build staging APK
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: staging
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB: ${{ secrets.STAGING_EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB }}
      EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE: ${{ secrets.STAGING_EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE }}
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.STAGING_EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_APPLE_AUTH_ENABLED: 'false'
      EXPO_PUBLIC_GOOGLE_AUTH_ENABLED: 'false'
      EXPO_PUBLIC_SOCIAL_LINKING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adhan-connect-staging-android
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
