name: Android Staging Build

on:
  workflow_dispatch: {}

jobs:
  build:
    name: Build staging APK/AAB
    runs-on: ubuntu-latest
    env:
      APP_VARIANT: staging
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB: ${{ secrets.STAGING_EXPO_PUBLIC_SUPABASE_REDIRECT_URL_WEB }}
      EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE: ${{ secrets.STAGING_EXPO_PUBLIC_SUPABASE_REDIRECT_URL_NATIVE }}
      EXPO_PUBLIC_API_BASE_URL: ${{ secrets.STAGING_EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_APPLE_AUTH_ENABLED: 'false'
      EXPO_PUBLIC_GOOGLE_AUTH_ENABLED: 'false'
      EXPO_PUBLIC_SOCIAL_LINKING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK (unsigned, for internal testing)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adhan-connect-staging-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Signed release AAB, for Play Console upload (internal testing track,
      # then production). Only runs once the upload keystore secrets exist —
      # harmless no-op until then, so this workflow keeps working for plain
      # debug-APK sideload testing in the meantime.
      - name: Check release signing secrets are configured
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode upload keystore
        if: steps.signing.outputs.configured == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Add release signing config
        if: steps.signing.outputs.configured == 'true'
        run: python3 scripts/patch-android-release-signing.py android/app/build.gradle

      - name: Build signed release AAB
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Upload signed AAB artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: adhan-connect-staging-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
