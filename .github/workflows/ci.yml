name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Diagnostics (temporary)
        run: |
          node --version
          npm --version
          npx tsc --version
          cat node_modules/typescript/package.json | grep '"version"'
          npx tsc --showConfig
      - run: npx tsc --noEmit
      - run: npm run lint
