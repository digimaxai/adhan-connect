name: CI

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, feature/cloud-recorded-adhan]

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:services
      - run: npm run test:adhan-audio
      - run: npm run test:adhan-delivery
      - run: npm run test:adhan-audio:db
